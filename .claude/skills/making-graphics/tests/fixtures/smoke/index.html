<!doctype html>
<html>
<head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}#root{position:absolute;inset:0}
#box{position:absolute;left:40%;top:40%;width:20%;height:20%;background:#fff;opacity:0}</style>
<script src="kit/hf-kit.js"></script>
</head>
<body>
<div id="root" data-composition-id="smoke" data-start="0" data-duration="1" data-fps="25" data-width="1920" data-height="1080">
  <div id="box"></div>
</div>
<script>
  const box = document.getElementById("box");
  kit.onFrame((t) => { box.style.opacity = String(kit.progress(t, 0, 0.8, "linear")); });
</script>
</body>
</html>
