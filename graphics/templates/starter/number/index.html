<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/variant.css">
<link rel="stylesheet" href="design/base.css">
<script src="kit/hf-kit.js"></script>
<script src="design/motion.js"></script>
<style>
  .block { position: absolute; left: var(--margin-x); top: 50%; transform: translateY(-50%); width: calc(100% - 2 * var(--margin-x)); }
  .num { position: relative; display: inline-block; font-size: var(--number-size); font-weight: var(--number-weight);
    line-height: 1; white-space: nowrap; letter-spacing: -.02em; }
  .num sup { font-size: calc(var(--number-exp-scale) * 1em); vertical-align: 1.3em; line-height: 0; }
  .num .unit { font-size: calc(var(--number-unit-scale) * 1em); margin-left: .3em; }
  .explain { margin-top: calc(var(--body-size) * 1.4); width: var(--text-width); }
  .src { margin-top: calc(var(--body-size) * 1.6); }
  .ring { position: absolute; overflow: visible; pointer-events: none; }
  .ring path { fill: none; stroke: var(--hl); stroke-width: var(--hand-stroke); stroke-linecap: round; }
  .note { position: absolute; }
  :root[data-orientation="vertical"] .block { top: auto; bottom: 30%; transform: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="number" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="page"></div>
  <div id="content">
    <div class="pattern" id="pattern"></div>
    <div class="block" id="block">
      <div class="num" id="num"></div>
      <div class="body explain" id="explain"></div>
      <div class="source src" id="src"></div>
    </div>
    <svg class="ring" id="ring"><path id="ringPath"/></svg>
    <div class="hand note" id="note"><span class="hand-tilt" id="noteText"></span></div>
  </div>
</div>
<script>
  const v = kit.vars();
  const $ = (id) => document.getElementById(id);
  $("pattern").classList.add(kit.token("--page-pattern"));

  // value: base, optional exponent, optional unit
  $("num").append(document.createTextNode(v.value.base));
  if (v.value.exp) { const sup = document.createElement("sup"); sup.textContent = v.value.exp; $("num").append(sup); }
  if (v.unit) { const u = document.createElement("span"); u.className = "unit ital"; u.textContent = v.unit; $("num").append(u); }

  // explanation with the highlighted phrase (first occurrence)
  if (v.explanation) {
    const i = v.highlight ? v.explanation.indexOf(v.highlight) : -1;
    if (i < 0) { $("explain").textContent = v.explanation; }
    else {
      const hl = document.createElement("span"); hl.className = "hl"; hl.textContent = v.highlight;
      $("explain").append(v.explanation.slice(0, i), hl, v.explanation.slice(i + v.highlight.length));
    }
  } else { $("explain").remove(); }
  if (v.source) $("src").textContent = "KAYNAK · " + v.source; else $("src").remove();
  if (v.hand) $("noteText").textContent = v.hand; else { $("note").remove(); $("ring").remove(); }

  /* A loose hand-drawn ring around a box (the showcase's stroke, scaled to the box). */
  function ringPath(w, h) {
    const P = [[30,120],[20,40,130,8,220,20],[300,32,300,150,210,185],[130,212,30,190,22,125],[18,95,40,70,60,62]];
    const sx = w / 300, sy = h / 210, f = (x, y) => (x * sx).toFixed(1) + " " + (y * sy).toFixed(1);
    return "M" + f(...P[0]) + P.slice(1).map((c) => " C " + f(c[0], c[1]) + ", " + f(c[2], c[3]) + ", " + f(c[4], c[5])).join("");
  }

  document.fonts.ready.then(() => {
    const W = $("root").getBoundingClientRect().width;
    const margin = kit.tokenNum("--margin-x") * W / 100;
    /* the ring reaches 12% past the number on each side: keep number and ring inside the margins */
    kit.fit($("num"), (W - 2 * margin) / (v.hand ? 1.24 : 1));
    const rootBox = $("root").getBoundingClientRect();
    if (v.hand) {
      const n = $("num").getBoundingClientRect();
      const padX = n.width * 0.12, padY = n.height * 0.28;
      const w = n.width + 2 * padX, h = n.height + 2 * padY;
      const ring = $("ring");
      ring.style.left = (n.left - rootBox.left - padX) + "px";
      ring.style.top = (n.top - rootBox.top - padY) + "px";
      ring.setAttribute("width", w); ring.setAttribute("height", h);
      ring.setAttribute("viewBox", "0 0 " + w + " " + h);
      $("ringPath").setAttribute("d", ringPath(w, h));
      const note = $("note");
      let nb = note.getBoundingClientRect();
      const beside = n.right - rootBox.left + padX * 1.2;
      /* beside the number when it fits inside the frame margin, otherwise above it (shrunk to fit if needed) */
      const above = kit.orientation() === "vertical" || beside + nb.width > W - margin;
      if (above) { kit.fit($("noteText"), W - margin - (n.left - rootBox.left) - nb.width * 0.08); nb = note.getBoundingClientRect(); }
      note.style.left = (above ? n.left - rootBox.left : beside) + "px";
      note.style.top = (above ? n.top - rootBox.top - padY - nb.height * 1.1
                              : n.top - rootBox.top + n.height * 0.05) + "px";
      calm.draw($("ringPath"));
      calm.hand(note);
    }
    calm.entry(document.querySelectorAll("#block > *"));
    document.querySelectorAll(".hl").forEach((el) => calm.highlight(el));
    calm.exit($("content"));
    calm.start();
  });
</script>
</body>
</html>
