<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/variant.css">
<link rel="stylesheet" href="design/base.css">
<script src="kit/hf-kit.js"></script>
<script src="design/motion.js"></script>
<style>
  .titles { position: absolute; left: var(--margin-x); top: 7cqw; }
  .titles .head { font-size: var(--chart-head-size); }
  #label { margin-bottom: calc(var(--label-size) * 1.4); }
  .chart { position: absolute; left: var(--margin-x); bottom: 9cqw; width: var(--chart-width); height: var(--chart-height);
    display: flex; align-items: flex-end; border-bottom: .08cqw solid var(--rule); }
  .col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bar { width: 100%; background: var(--bar-color); transform-origin: bottom; }
  .val { font-size: var(--bar-value-size); margin-bottom: .5cqw; white-space: nowrap; }
  .lab { position: absolute; top: calc(100% + .9cqw); font: 400 var(--bar-label-size) var(--font-label); color: var(--label);
    letter-spacing: .06em; white-space: nowrap; }
  .src { position: absolute; left: var(--margin-x); bottom: 3.6cqw; }
  .ring { position: absolute; overflow: visible; }
  .ring path { fill: none; stroke: var(--hl); stroke-width: var(--hand-stroke); stroke-linecap: round; }
  .note { position: absolute; }
</style>
</head>
<body>
<div id="root" data-composition-id="bar-chart" data-start="0" data-duration="7" data-width="1920" data-height="1080">
  <div class="page"></div>
  <div id="content">
    <div class="pattern" id="pattern"></div>
    <div class="titles" id="titles">
      <div class="label" id="label"></div>
      <div class="head" id="line1"></div>
      <div class="head second" id="line2"></div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="source src" id="src"></div>
    <svg class="ring" id="ring"><path id="ringPath"/></svg>
    <div class="hand note" id="note"><span class="hand-tilt" id="noteText"></span></div>
  </div>
</div>
<script>
  const v = kit.vars();
  const $ = (id) => document.getElementById(id);
  $("pattern").classList.add(kit.token("--page-pattern"));
  $("label").textContent = v.label; if (!v.label) $("label").remove();
  $("line1").textContent = v.line1;
  $("line2").textContent = v.line2; if (!v.line2) $("line2").remove();
  const srcText = [v.unit, v.source && "KAYNAK · " + v.source].filter(Boolean).join(" · ");
  if (srcText) $("src").textContent = srcText; else $("src").remove();

  const fmt = (x) => x.toLocaleString("tr-TR", { maximumFractionDigits: 2 });
  const max = Math.max(...v.bars.map((b) => b.value), 0) || 1;
  const n = v.bars.length;
  const gap = kit.tokenNum("--bar-gap");
  const omin = kit.tokenNum("--bar-opacity-min");
  const cols = v.bars.map((b, i) => {
    const col = document.createElement("div"); col.className = "col";
    col.style.width = (100 / (n + (n - 1) * gap)) + "%";
    if (i > 0) col.style.marginLeft = (100 * gap / (n + (n - 1) * gap)) + "%";
    const val = document.createElement("div"); val.className = "val"; val.textContent = fmt(b.value);
    const bar = document.createElement("div"); bar.className = "bar";
    bar.style.height = (88 * Math.max(b.value, 0) / max) + "%";
    bar.style.opacity = String(omin + (1 - omin) * (n > 1 ? i / (n - 1) : 1));
    const lab = document.createElement("div"); lab.className = "lab"; lab.textContent = b.label;
    col.append(val, bar, lab); $("chart").append(col);
    return { col, val, bar, lab, label: b.label };
  });
  if (!v.hand) { $("note").remove(); $("ring").remove(); } else $("noteText").textContent = v.hand;

  /* The showcase's loose vertical loop around a bar, scaled to its box. */
  function loopPath(w, h) {
    const P = [[540,-40],[520,40,530,200,560,250],[590,290,640,280,648,240],[660,160,650,40,628,-30],[615,-60,570,-60,552,-30]];
    const x0 = 515, y0 = -60, sx = w / 150, sy = h / 350, f = (x, y) => ((x - x0) * sx).toFixed(1) + " " + ((y - y0) * sy).toFixed(1);
    return "M" + f(...P[0]) + P.slice(1).map((c) => " C " + f(c[0], c[1]) + ", " + f(c[2], c[3]) + ", " + f(c[4], c[5])).join("");
  }

  document.fonts.ready.then(() => {
    const W = $("root").getBoundingClientRect().width;
    const rootBox = $("root").getBoundingClientRect();
    /* bars never wider than --bar-max-width: a chart of few bars gets narrower instead */
    const maxBar = kit.tokenNum("--bar-max-width") * W / 100;
    const chartW = Math.min($("chart").getBoundingClientRect().width, maxBar * (n + (n - 1) * gap));
    $("chart").style.width = chartW + "px";
    ["line1", "line2"].forEach((id) => $(id) && kit.fit($(id), W * 0.84));
    /* labels and values must not collide: shrink them together to the narrowest column */
    const colW = cols[0].col.getBoundingClientRect().width * (1 + gap * 0.8);
    cols.forEach((c) => { kit.fit(c.lab, colW); kit.fit(c.val, colW); });
    const minLab = Math.min(...cols.map((c) => parseFloat(c.lab.style.fontSize) || Infinity));
    if (Number.isFinite(minLab)) cols.forEach((c) => (c.lab.style.fontSize = minLab + "px"));

    if (v.hand) {
      const target = cols.find((c) => c.label === v.hand_bar) || cols[cols.length - 1];
      const b = target.col.getBoundingClientRect();
      const bar = target.bar.getBoundingClientRect();
      const top = Math.min(bar.top, target.val.getBoundingClientRect().top);
      const pad = Math.min(b.width * 0.35, W * 0.02);
      const padX = pad, padY = pad * 1.3;
      const w = b.width + 2 * padX, h = b.bottom - top + 2 * padY;
      const ring = $("ring");
      ring.style.left = (b.left - rootBox.left - padX) + "px"; ring.style.top = (top - rootBox.top - padY) + "px";
      ring.setAttribute("width", w); ring.setAttribute("height", h); ring.setAttribute("viewBox", "0 0 " + w + " " + h);
      $("ringPath").setAttribute("d", loopPath(w, h));
      const note = $("note"), nb = note.getBoundingClientRect();
      /* right of the ring only for the last bar with room; otherwise above the ring, clear of other bars */
      const right = b.right - rootBox.left + padX * 1.1;
      const besides = target === cols[cols.length - 1] && right + nb.width < W * 0.97;
      note.style.left = (besides ? right : Math.min(b.left - rootBox.left - padX, W * 0.97 - nb.width)) + "px";
      let noteTop = besides ? top - rootBox.top - padY * 0.2 : top - rootBox.top - padY - nb.height * 1.05;
      if (!besides) {
        /* lift the note above any other bar (or its value) it would cross */
        const l = parseFloat(note.style.left) + rootBox.left, r = l + nb.width;
        cols.filter((c) => c !== target).forEach((c) => {
          const cb = c.col.getBoundingClientRect(), vb = c.val.getBoundingClientRect();
          if (cb.right > l && cb.left < r) noteTop = Math.min(noteTop, vb.top - rootBox.top - nb.height * 1.1);
        });
      }
      note.style.top = noteTop + "px";
      calm.draw($("ringPath"));
      calm.hand(note);
    }

    calm.entry(document.querySelectorAll("#titles > *"));
    if ($("src")) calm.entry([$("src")]);
    calm.entry([$("chart")]);
    const at = kit.tokenNum("--motion-bar-at"), dur = kit.tokenNum("--motion-bar"), st = kit.tokenNum("--motion-bar-stagger");
    const ease = kit.token("--motion-ease");
    kit.onFrame((t) => cols.forEach((c, i) => {
      const p = kit.progress(t, at + i * st, dur, ease);
      c.bar.style.transform = "scaleY(" + p + ")";
      c.val.style.opacity = String(kit.progress(t, at + i * st + dur * 0.6, dur * 0.5, ease));
    }));
    calm.exit($("content"));
    calm.start();
  });
</script>
</body>
</html>
