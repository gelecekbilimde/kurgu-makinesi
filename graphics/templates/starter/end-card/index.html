<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/variant.css">
<link rel="stylesheet" href="design/base.css">
<script src="kit/hf-kit.js"></script>
<script src="design/motion.js"></script>
<style>
  .block { position: absolute; left: 8cqw; right: 8cqw; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column;
    align-items: center; text-align: center; }
  .logo { width: var(--end-logo-size); height: var(--end-logo-size); margin-bottom: 8cqw; }
  #title { font-size: var(--end-title-size); line-height: 1.08; white-space: normal; margin: 3cqw 0 5cqw; }
</style>
</head>
<body>
<div id="root" data-composition-id="end-card" data-start="0" data-duration="3" data-width="1920" data-height="1080">
  <div class="page"></div>
  <div id="content">
    <div class="pattern" id="pattern"></div>
    <div class="block">
      <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 160 160"><defs><clipPath id="globe"><circle cx="100" cy="100" r="80"/></clipPath></defs><circle cx="100" cy="100" r="80" fill="var(--logo-globe)"/><g clip-path="url(#globe)" fill="var(--logo-land)"><path d="M10 70 C 40 48, 64 62, 78 46 C 92 30, 112 40, 122 30 C 136 18, 150 20, 160 10 L 0 0 Z"/><path d="M150 110 C 162 96, 184 100, 200 92 L 200 200 L 160 200 C 168 176, 140 168, 146 146 C 150 132, 142 122, 150 110 Z"/><path d="M0 150 C 20 140, 40 150, 52 168 C 60 182, 50 196, 40 200 L 0 200 Z"/></g><text x="100" y="96" text-anchor="middle" font-family="Fraunces" font-size="33" fill="var(--logo-text)" letter-spacing="-.5">gelecek</text><text x="100" y="128" text-anchor="middle" font-family="Fraunces" font-style="italic" font-weight="300" font-size="33" fill="var(--logo-text)">bilimde</text></svg></div><div class="label">YENİ VİDEO</div><div class="head" id="title"></div>
      <div class="body ital">Videonun tamamı YouTube kanalımızda</div>
    </div>
  </div>
</div>
<script>
  const v = kit.vars();
  const $ = (id) => document.getElementById(id);
  $("pattern").classList.add(kit.token("--page-pattern"));
  $("title").textContent = v.title;
  document.fonts.ready.then(() => { calm.entry(document.querySelectorAll(".block > *")); calm.start(); });
</script>
</body>
</html>
